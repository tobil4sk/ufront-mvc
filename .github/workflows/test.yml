name: Test

on: [push, pull_request]

jobs:
  test:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest, macos-13]
        haxe-version: [latest, 4.3.6]

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe-version }}

      - run: |
          haxelib install all --quiet --always
          haxelib install minject 2.0.0-rc.1 && haxelib set minject 2.0.0-rc.1

          haxelib list
        name: Install haxelibs

      - run: |
          set -e
          haxe test-neko.hxml
          neko build/neko_test.n
        name: Test neko

      - run: |
          set -e
          haxe test-php.hxml
          php build/php_test.php
        name: Test php

      - run: |
          haxe test-js-browser.hxml
        name: Test js build
